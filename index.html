<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi yo para que no te estreses</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1 id="titulo">Mi yo para que no te estreses</h1>
  <p id="sujeto" class="sub"></p>
</header>
<main id="stage">
  <canvas id="c" aria-label="Modelo anatómico 3D interactivo"></canvas>
  <aside id="panel" aria-label="Capas">
    <h3>Capas</h3>
    <button data-l="piel" aria-pressed="true"><i style="--d:#e9bda5"></i>Piel</button>
    <button data-l="musculos" aria-pressed="false"><i style="--d:#b04040"></i>Músculos</button>
    <button data-l="huesos" aria-pressed="true"><i style="--d:#ebe3d0"></i>Huesos</button>
    <button data-l="vasos" aria-pressed="true"><i style="--d:#e0364a"></i>Vasos</button>
    <button data-l="nervios" aria-pressed="true"><i style="--d:#f3d878"></i>Nervios</button>
    <label>Opacidad de piel y músculo<input id="opa" type="range" min="0" max="1" step=".01" value=".3"></label>
  </aside>
  <div id="card" role="dialog" aria-live="polite"><div class="box"><button id="cx" type="button" aria-label="Cerrar">&times;</button><h2></h2><p></p></div></div>
  <div id="dock">
    <form id="msgbar" autocomplete="off">
      <input id="msg" type="text" maxlength="500" placeholder="Escríbeme algo bonito…" aria-label="Mensaje">
      <button type="submit" id="send">Enviar</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </div>
</main>
<!-- Three.js r128 en este orden; si una CDN falla se carga la de respaldo -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>(window.THREE&&THREE.OrbitControls)||document.write('<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>(window.THREE&&THREE.GLTFLoader)||document.write('<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>(window.THREE&&THREE.BufferGeometryUtils)||document.write('<script src="https://unpkg.com/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"><\/script>')</script>
<script src="js/discord.js"></script>
<script src="js/main.js"></script>
</body>
</html>
